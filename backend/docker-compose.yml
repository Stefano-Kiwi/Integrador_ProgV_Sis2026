services:
  postgres:
    image: postgres:18-alpine
    container_name: fitzone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fitzone_sports
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fitzone_sports" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitzone_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: fitzone_jwt_secret_dev_key_2026
      DATABASE_URL: "postgresql://postgres:secret@postgres:5432/fitzone_sports?schema=public"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
