services:
  postgres:
    image: postgres:18-alpine
    container_name: grupo12_ProgV_integrador
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: fitzone_sports
    ports:
      - "5432:5432"
    volumes:
      # El esquema lo crean las migraciones de Prisma (npm run db:migrate), no init.sql.
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
