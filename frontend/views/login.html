<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El tremendo Gym</title>
  <meta name="description"
    content="Inicia sesión en El tremendo Gym. Accede a tu rutina de entrenamiento, reservas de clases, control de aforo y pase digital.">

  <!-- Google Fonts: Bebas Neue para títulos de impacto, Plus Jakarta Sans para lectura moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../public/css/style.css">
</head>

<body>

  <!-- Contenedor principal con fondo de gimnasio a pantalla completa -->
  <div class="login-wrapper">

    <!-- Tarjeta de Autenticación Centrada sobre la Imagen -->
    <main class="auth-card">

      <!-- Logotipo de la Marca -->
      <div class="card-brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 5v14M18 5v14M2 9h4M18 9h4M2 15h4M18 15h4M6 12h12" />
        </svg>
        <span class="brand-text">EL TREMENDO<span class="highlight"> GYM</span></span>
      </div>

      <!-- Encabezado del Formulario -->
      <header class="auth-header">
        <h1 class="auth-title">BIENVENIDO DE VUELTA</h1>
        <p class="auth-subtitle">Ingresa tus credenciales para acceder a tu cuenta</p>
      </header>

      <!-- Formulario Semántico de Inicio de Sesión -->
      <form class="login-form" action="#" method="POST" autocomplete="on">

        <!-- Campo: Identificador o Correo Electrónico -->
        <div class="form-group">
          <div class="label-row">
            <label for="username" class="input-label">Correo Electrónico</label>
            <span class="hint-text">Ej: usuario@eltremendo.com</span>
          </div>

          <div class="input-container">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input type="email" id="username" name="username" class="form-input" placeholder="nombre@correo.com"
              required autocomplete="username" enterkeyhint="next" aria-describedby="email-validation-tip">
            <span class="validation-badge" aria-hidden="true">✓</span>
          </div>
          <p id="email-validation-tip" class="field-feedback">Por favor introduce un correo válido.</p>
        </div>

        <!-- Campo: Contraseña -->
        <div class="form-group">
          <div class="label-row">
            <label for="current-password" class="input-label">Contraseña</label>
            <a href="" class="forgot-link">¿Olvidaste tu clave?</a>
          </div>

          <div class="input-container">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input type="password" id="current-password" name="password" class="form-input" placeholder="••••••••••••"
              required minlength="6" autocomplete="current-password" enterkeyhint="done"
              aria-describedby="password-hint">
            <span class="validation-badge" aria-hidden="true">✓</span>
          </div>
          <p id="password-hint" class="field-feedback">Mínimo 6 caracteres para ingresar.</p>
        </div>

        <!-- Opciones Extras: Recordar sesión -->
        <div class="form-extra-row">
          <label class="remember-toggle">
            <input type="checkbox" name="remember_me" class="checkbox-input" checked>
            <span class="custom-check"></span>
            <span class="toggle-text">Recordar este dispositivo</span>
          </label>
        </div>

        <!-- Botón de Envío Principal -->
        <button type="submit" class="submit-btn" id="submit-login">
          <span class="btn-text">INGRESAR AL GIMNASIO</span>
          <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12" />
            <polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
      </form>

      <!-- Pie de tarjeta: Enlace a Registro o Prueba Gratis -->
      <footer class="auth-card-footer">
        <p>¿Todavía no eres miembro de El tremendo gym? <a href="" class="register-cta">Registrate
            ahora</a></p>
      </footer>

    </main>

  </div>


</body>

</html>
